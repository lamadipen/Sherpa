<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHERPA – Climb the Sacred Peaks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #e0e0e0;
    }

    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #bootScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0d1117 0%, #1a1a2e 50%, #0d1117 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    #bootScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .boot-logo {
      font-family: 'Teko', sans-serif;
      font-size: clamp(56px, 10vw, 120px);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #fff;
      text-shadow:
        0 0 40px rgba(192, 57, 43, 0.8),
        0 0 80px rgba(192, 57, 43, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    .boot-nepali {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      color: #f0a500;
      letter-spacing: 0.1em;
      margin-top: 8px;
      opacity: 0.9;
    }

    .boot-tagline {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(14px, 2vw, 18px);
      color: #8899aa;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 16px;
    }

    .boot-progress-container {
      margin-top: 60px;
      width: clamp(200px, 40vw, 400px);
    }

    .boot-progress-bar {
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .boot-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c0392b, #f0a500);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    .boot-status {
      font-size: 12px;
      color: #556677;
      margin-top: 10px;
      text-align: center;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .prayer-flags {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: none;
      z-index: 99;
    }

    .flag {
      width: 40px;
      height: 32px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: flagWave 2s ease-in-out infinite;
    }

    .flag:nth-child(5n+1) { background: #1a6bcc; animation-delay: 0s; }
    .flag:nth-child(5n+2) { background: #f5f5f5; animation-delay: 0.2s; }
    .flag:nth-child(5n+3) { background: #d32f2f; animation-delay: 0.4s; }
    .flag:nth-child(5n+4) { background: #2e7d32; animation-delay: 0.6s; }
    .flag:nth-child(5n+5) { background: #f9a825; animation-delay: 0.8s; }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 40px rgba(192,57,43,0.8), 0 0 80px rgba(192,57,43,0.4); }
      50% { text-shadow: 0 0 60px rgba(192,57,43,1), 0 0 120px rgba(192,57,43,0.6), 0 0 160px rgba(240,165,0,0.3); }
    }

    @keyframes flagWave {
      0%, 100% { transform: skewY(0deg) scaleY(1); }
      50% { transform: skewY(3deg) scaleY(0.95); }
    }
  </style>
</head>
<body>
  <div id="bootScreen">
    <div class="boot-logo">SHERPA</div>
    <div class="boot-nepali">शेर्पा</div>
    <div class="boot-tagline">Climb the Sacred Peaks of Nepal</div>
    <div class="boot-progress-container">
      <div class="boot-progress-bar">
        <div class="boot-progress-fill" id="bootProgress"></div>
      </div>
      <div class="boot-status" id="bootStatus">Initializing...</div>
    </div>
  </div>

  <div class="prayer-flags" id="prayerFlags"></div>

  <canvas id="renderCanvas"></canvas>

  <script type="module" src="/src/main.js"></script>

  <script>
    // Generate prayer flags
    const flagsContainer = document.getElementById('prayerFlags');
    for (let i = 0; i < 40; i++) {
      const flag = document.createElement('div');
      flag.className = 'flag';
      flagsContainer.appendChild(flag);
    }

    // Boot progress updater (called from main.js)
    window.setBootProgress = (pct, status) => {
      const progress = document.getElementById('bootProgress');
      const bootStatus = document.getElementById('bootStatus');
      if (!progress || !bootStatus) return;

      progress.style.width = pct + '%';
      bootStatus.textContent = status;
    };

    window.hideBootScreen = () => {
      const boot = document.getElementById('bootScreen');
      boot.classList.add('hidden');
      setTimeout(() => boot.remove(), 1000);
    };
  </script>
</body>
</html>
